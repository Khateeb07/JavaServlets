<html>
    <head>
        <title>Java Web App</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>
        <div class="bg-light">
            <div id="header">
                <nav class="navbar navbar-expand-md justify-content-center bg-dark navbar-dark">
                    <ul class="navbar-nav nav-pills my-2">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact Us</a>
                        </li>
                    </ul>
                </nav>
            </div><!-- End of header-->
            <div class="h1 text-center my-3">Registration Form</div>
            <form action="register" method="POST" class="row justify-content-center">
                <div class="col-md-7 my-2">
                    <label for="fname">First Name:</label>
                    <input type="text" class="form-control" id="fname" placeholder="Enter First Name" name="fname"/>
                </div>
                <div class="col-md-7 my-2">
                    <label for="lname">Last Name:</label>
                    <input type="text" class="form-control form-label" id="lname" placeholder="Enter Last Name" name="lname"/>
                </div>
                <div class="col-md-7 my-2">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control form-label" id="email" placeholder="Enter your email" name="email"/>
                </div>
                <div class="col-md-7 my-2">
                    <label for="password">Password:</label>
                    <input type="password" class="form-control form-label" id="password" placeholder="Enter your password" name="pass"/>
                </div>                
                <input type="submit" value="Register" class="btn btn-primary col-md-7 my-3"/>
                <p class="text-center"><a href="info.html">Want to fetch details?</a></p>
            </form>
        </div>
        <script src="js/bootstrap.js" type="text/javascript"></script>
    </body>
</html>
